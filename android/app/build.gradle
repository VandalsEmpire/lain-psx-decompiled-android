plugins {
    id "com.android.application"
}

def sdlRoot = rootProject.file(".deps/SDL2-2.32.10")

// Local release signing credentials. Never commit keystore.properties.
def releaseSigningPropertiesFile = rootProject.file("keystore.properties")
def releaseSigningProperties = new java.util.Properties()
def releaseSigningConfigured = releaseSigningPropertiesFile.isFile()
def releaseSigningStoreFile = null

if (releaseSigningConfigured) {
    releaseSigningPropertiesFile.withInputStream {
        releaseSigningProperties.load(it)
    }

    def requiredSigningKeys = ["storeFile", "storePassword", "keyAlias", "keyPassword"]
    def missingSigningKeys = requiredSigningKeys.findAll {
        !releaseSigningProperties.getProperty(it, "").trim()
    }
    if (!missingSigningKeys.isEmpty()) {
        throw new GradleException("Missing keys in android/keystore.properties: " + missingSigningKeys.join(", "))
    }

    def storePath = releaseSigningProperties.getProperty("storeFile").trim()
    releaseSigningStoreFile = new File(storePath)
    if (!releaseSigningStoreFile.isAbsolute()) {
        releaseSigningStoreFile = rootProject.file(storePath)
    }
    if (!releaseSigningStoreFile.isFile()) {
        throw new GradleException("Release keystore not found: " + releaseSigningStoreFile)
    }
}


android {
    namespace "org.libsdl.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.vandalsempire.lain"
        minSdk 23
        targetSdk 35
        versionCode 2
        versionName "0.2.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
    }

    signingConfigs {
        if (releaseSigningConfigured) {
            release {
                storeFile = releaseSigningStoreFile
                storePassword = releaseSigningProperties.getProperty("storePassword")
                keyAlias = releaseSigningProperties.getProperty("keyAlias")
                keyPassword = releaseSigningProperties.getProperty("keyPassword")
                enableV1Signing = true
                enableV2Signing = true
                enableV3Signing = true
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
            if (releaseSigningConfigured) {
                signingConfig signingConfigs.release
            }
        }
    }

    sourceSets {
        main {
            // SDLActivity and its resources come from the pinned SDL2 release.
            java.srcDir(new File(sdlRoot, "android-project/app/src/main/java"))
            res.srcDir(new File(sdlRoot, "android-project/app/src/main/res"))
        }
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.31.6"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}

// AGP 9.5 exposes the APK filename through the public VariantOutput API.
androidComponents {
    onVariants(selector().all()) { variant ->
        variant.outputs.forEach { output ->
            // Colons are not valid in filenames on Windows; the app label keeps "re:Lain".
            output.outputFileName.set("re-Lain-${variant.name}.apk")
        }
    }
}
