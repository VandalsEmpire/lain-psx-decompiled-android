plugins {
    id "com.android.application"
}

def sdlRoot = rootProject.file(".deps/SDL2-2.32.10")

android {
    namespace "org.libsdl.app"
    compileSdk 36
    ndkVersion "28.2.13676358"

    defaultConfig {
        applicationId "com.vandalsempire.lain"
        minSdk 23
        targetSdk 35
        versionCode 1
        versionName "0.1.0"

        ndk {
            abiFilters "arm64-v8a"
        }

        externalNativeBuild {
            cmake {
                arguments "-DANDROID_STL=c++_shared"
                cppFlags "-std=c++17"
            }
        }
    }

    buildTypes {
        debug {
            applicationIdSuffix ".debug"
            debuggable true
        }
        release {
            minifyEnabled false
        }
    }

    sourceSets {
        main {
            // SDLActivity and its resources come from the pinned SDL2 release.
            java.srcDir(new File(sdlRoot, "android-project/app/src/main/java"))
            res.srcDir(new File(sdlRoot, "android-project/app/src/main/res"))
        }
    }

    externalNativeBuild {
        cmake {
            path file("../CMakeLists.txt")
            version "3.31.6"
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    packaging {
        jniLibs {
            useLegacyPackaging true
        }
    }
}
