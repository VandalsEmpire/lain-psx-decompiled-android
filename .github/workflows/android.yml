name: Android debug APK

on:
  push:
    branches: [android-port]
    paths:
      - "android/**"
      - "port/**"
      - ".github/workflows/android.yml"
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
        with:
          packages: platform-tools

      - name: Install Android toolchain
        run: |
          sdkmanager --install \
            "platforms;android-36" \
            "build-tools;36.0.0" \
            "ndk;28.2.13676358" \
            "cmake;3.31.6"

      - name: Set up Gradle 9.6
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.6.0"

      - name: Build debug APK
        run: gradle --no-daemon -p android assembleDebug

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: re-Lain-android-debug
          path: android/app/build/outputs/apk/debug/re-Lain-debug.apk
          if-no-files-found: error
